
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oman EcoSync Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="/index.css">
    <style>
      @media print {
        .no-print { display: none !important; }
        body { background-color: white !important; font-size: 12pt; }
        .printable-area { border: none !important; box-shadow: none !important; margin: 0 !important; width: 100% !important; max-width: 100% !important; }
      }
      /* Hide the default Google Translate widget */
      .skiptranslate iframe { display: none !important; }
      body { top: 0 !important; }
      #google_translate_element { display: none; }
    </style>
    <script>
      (function() {
        var savedLang = 'en';
        try {
          var cookieStr = decodeURIComponent(document.cookie);
          var match = cookieStr.match(/googtrans=\/en\/(ar|en)/);
          if (match) {
            savedLang = match[1];
          } else {
            savedLang = localStorage.getItem('biofuel_lang') || 'en';
          }
        } catch (e) {}
        
        if (savedLang === 'ar') {
          document.documentElement.dir = 'rtl';
          // Set cookie for current domain and parent domain to ensure Google Translate picks it up
          document.cookie = "googtrans=/en/ar; path=/; SameSite=None; Secure";
          document.cookie = "googtrans=/en/ar; path=/; domain=" + window.location.hostname + "; SameSite=None; Secure";
          
          // Also set it without SameSite=None for older browsers or specific iframe contexts
          document.cookie = "googtrans=/en/ar; path=/";
        } else {
          // Clear cookies
          document.cookie = "googtrans=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC; SameSite=None; Secure";
          document.cookie = "googtrans=; path=/; domain=" + window.location.hostname + "; expires=Thu, 01 Jan 1970 00:00:00 UTC; SameSite=None; Secure";
          document.cookie = "googtrans=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC";
        }
      })();
    </script>
</head>
  <body class="bg-slate-950 text-slate-200 font-sans">
    <div id="google_translate_element"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'ar,en',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
