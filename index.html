    <script>
      (function() {
        // Force clear any old translation cookies
        document.cookie = "googtrans=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC; SameSite=None; Secure";
        document.cookie = "googtrans=; path=/; domain=" + window.location.hostname + "; expires=Thu, 01 Jan 1970 00:00:00 UTC; SameSite=None; Secure";
        document.cookie = "googtrans=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC";
      })();
      
      // Suppress benign Vite WebSocket/HMR connection rejections in sandboxed dev environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason ? (event.reason.message || String(event.reason)) : '';
        var stack = event.reason && event.reason.stack ? event.reason.stack : '';
        if (
          reason.indexOf('WebSocket') !== -1 ||
          reason.indexOf('vite') !== -1 ||
          stack.indexOf('@vite/client') !== -1
        ) {
          event.preventDefault();
          return;
        }
        console.error('[Unhandled Promise Rejection]', event.reason);
      });

      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        var filename = event.filename || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('vite') !== -1 ||
          filename.indexOf('@vite/client') !== -1
        ) {
          event.preventDefault();
          return;
        }
      });
    </script>
